[project]
name = "sam3-backend"
version = "0.10.0"
description = "SAM 3 stateful GPU inference backend"
requires-python = ">=3.12,<3.13"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "aap-backend-runtime==0.1.0",
    "aap-lifecycle-contract==0.1.0",
    "aap-protocol-v2==0.2.0",
    "aap-task-contract==0.1.0",
    "anno-mask-utils==0.1.0",
    "torch==2.7.1", "torchvision==0.22.1",
    "sam3[train]",
    "fastapi>=0.110", "uvicorn[standard]>=0.27", "pydantic>=2.5",
    "httpx>=0.27", "numpy>=1.26,<2", "pillow>=10.0",
    "opencv-python-headless>=4.9", "shapely>=2.0", "huggingface_hub>=0.23",
    "transformers>=4.45", "supervision>=0.21", "prometheus-client>=0.20",
    "pynvml>=11.5", "psutil>=5.9", "cryptography>=43.0.0", "PyJWT>=2.10,<3",
    "einops>=0.7", "pycocotools>=2.0", "open_clip_torch>=2.24",
    "setuptools>=77,<81", "wheel", "pyOpenSSL>=24.2.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[build-system]
requires = ["setuptools>=77,<81", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main", "predictor", "video_predictor", "pvs_video_predictor", "schemas", "embedding_cache", "observability", "pool_domain", "gpu_lifecycle"]
packages = ["sam3_plugin"]
include-package-data = true

[tool.setuptools.package-data]
sam3_plugin = ["pretrained-assets.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv.sources]
aap-backend-runtime = { url = "https://github.com/YOAO-Labs/Plugin-SDK/releases/download/python-sdk-1380d8a79814/aap_backend_runtime-0.1.0-py3-none-any.whl" }
aap-lifecycle-contract = { url = "https://github.com/YOAO-Labs/Plugin-SDK/releases/download/contracts-906628f2619b/aap_lifecycle_contract-0.1.0-py3-none-any.whl" }
aap-protocol-v2 = { url = "https://github.com/YOAO-Labs/Plugin-SDK/releases/download/contracts-906628f2619b/aap_protocol_v2-0.2.0-py3-none-any.whl" }
aap-task-contract = { url = "https://github.com/YOAO-Labs/Plugin-SDK/releases/download/contracts-906628f2619b/aap_task_contract-0.1.0-py3-none-any.whl" }
anno-mask-utils = { url = "https://github.com/YOAO-Labs/Plugin-SDK/releases/download/python-sdk-0.1.0/anno_mask_utils-0.1.0-py3-none-any.whl" }
sam3 = { path = "vendor/sam3" }
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
