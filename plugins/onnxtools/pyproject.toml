[project]
name = "onnxtools-backend"
version = "0.3.0"
description = "onnxtools (rtdetr + vehicle-attribute) ML backend — two-stage vehicle attribute pre-annotation for ai-annotation-platform"
requires-python = ">=3.10"
license = { file = "LICENSE" }

dependencies = [
    "aap-backend-runtime==0.1.0",
    "aap-lifecycle-contract",
    "aap-protocol-v2==0.2.0",
    "aap-task-contract==0.1.0",
    "cryptography>=43.0.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.5",
    "PyJWT>=2.10,<3",
    "httpx>=0.27",
    "numpy==2.2.6",
    "onnxtools[inference] @ git+https://github.com/yyq19990828/onnxtools.git@102fcfeb08fc00f865c334a181bfd0bb518e5ed8",
    "onnxruntime-gpu==1.22.0",
    "opencv-contrib-python-headless==5.0.0.93",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]
build = ["setuptools==80.9.0", "wheel==0.45.1"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main", "predictor", "schemas", "attribute_schema", "handle_pool", "gpu_lifecycle"]

[tool.setuptools.data-files]
"share/onnxtools-backend" = ["scripts/validate_managed_lifecycle.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Tests use the same published contract wheels installed in the image.
pythonpath = ["."]

[tool.uv.sources]
aap-backend-runtime = { url = "https://github.com/YOAO-Labs/YOAO-Plugins/releases/download/python-6118885dd686/aap_backend_runtime-0.1.0-py3-none-any.whl" }
aap-lifecycle-contract = { url = "https://github.com/YOAO-Labs/YOAO-Plugins/releases/download/contracts-0a21bc402432/aap_lifecycle_contract-0.1.0-py3-none-any.whl" }
aap-protocol-v2 = { url = "https://github.com/YOAO-Labs/YOAO-Plugins/releases/download/contracts-0a21bc402432/aap_protocol_v2-0.2.0-py3-none-any.whl" }
aap-task-contract = { url = "https://github.com/YOAO-Labs/YOAO-Plugins/releases/download/contracts-0a21bc402432/aap_task_contract-0.1.0-py3-none-any.whl" }
