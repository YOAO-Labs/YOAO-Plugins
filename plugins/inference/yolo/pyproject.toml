[project]
name = "yolo-backend"
version = "0.1.0"
description = "YOLO (ultralytics) ML Backend for ai-annotation-platform — det/seg/pose/obb multi-task, multi-series"
license = "MIT"
license-files = ["LICENSE", "AGPL-3.0.txt"]
requires-python = ">=3.11,<3.14"

# Binary packages are supplied by the matching immutable Docker base.
dependencies = [
    "aap-backend-runtime",
    "aap-lifecycle-contract",
    "aap-protocol-v2",
    "aap-task-contract",
    "torch==2.14.1",
    "torchvision==0.29.1",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.5",
    "httpx>=0.27",
    "numpy>=1.24,<3.0",
    "pillow>=10.0",
    "opencv-python>=4.9",
    "prometheus-client>=0.20",
    "cryptography>=43.0.0",
    "PyJWT>=2.10,<3",
    "ultralytics==8.4.183",
    "aap-training-contract",
    "clip",
    "setuptools>=68",
    "wheel",
    # Ultralytics tracker runtime dependency; bake it in instead of AutoUpdate.
    "lap>=0.5.12",
    # PerfHud · GPU util/温度/功耗 + 容器 CPU/RAM
    "pynvml>=11.5",
    "psutil>=5.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main", "predictor", "schemas", "model_pool", "model_registry", "class_names", "model_metadata", "observability", "managed_models", "managed_segmentation", "sample_evaluations", "segmentation_evaluations"]
packages = ["scripts", "yolo_plugin"]
include-package-data = true

[tool.setuptools.package-data]
yolo_plugin = ["pretrained-assets.json"]

[tool.uv.sources]
aap-backend-runtime = { url = "https://github.com/YOAO-Labs/Plugin-SDK/releases/download/python-sdk-0.1.0/aap_backend_runtime-0.1.0-py3-none-any.whl" }
aap-lifecycle-contract = { url = "https://github.com/YOAO-Labs/YOAO-Plugins/releases/download/contracts-3d6393e64630/aap_lifecycle_contract-0.1.0-py3-none-any.whl" }
aap-protocol-v2 = { url = "https://github.com/YOAO-Labs/YOAO-Plugins/releases/download/contracts-3d6393e64630/aap_protocol_v2-0.2.0-py3-none-any.whl" }
aap-task-contract = { url = "https://github.com/YOAO-Labs/YOAO-Plugins/releases/download/contracts-3d6393e64630/aap_task_contract-0.1.0-py3-none-any.whl" }
aap-training-contract = { url = "https://github.com/YOAO-Labs/YOAO-Plugins/releases/download/contracts-3d6393e64630/aap_training_contract-0.1.0-py3-none-any.whl" }
torch = { index = "pytorch-cu132" }
torchvision = { index = "pytorch-cu132" }
clip = { git = "https://github.com/ultralytics/CLIP.git", rev = "7ffa84b3bfa40c42ecc1c77147a855e69cb2dd40" }

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
