[project]
name = "yoao-rapidocr-plugin"
version = "0.1.0"
description = "YOAO RapidOCR plugin — OCR detection, recognition and end-to-end composition"
requires-python = ">=3.10"
license = { file = "LICENSE" }

dependencies = [
    "yoao-backend-runtime==0.1.0",
    "yoao-lifecycle-contract",
    "yoao-protocol-v2==0.2.0",
    "yoao-task-contract==0.1.0",
    "cryptography>=43.0.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.5",
    "PyJWT>=2.10,<3",
    "httpx>=0.27",
    "numpy==2.2.6",
    "Pillow>=10",
    "rapidocr==3.9.0",
    "opencv-python-headless==5.0.0.93",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]
cpu = ["onnxruntime==1.23.2"]
cuda = [
    "onnxruntime-gpu==1.23.2",
    "nvidia-cudnn-cu12==9.10.2.21; sys_platform == 'linux' and platform_machine == 'x86_64'",
]
build = ["setuptools==80.9.0", "wheel==0.45.1"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main", "predictor", "schemas", "catalog", "engine_pool", "gpu_lifecycle", "download_models", "plugin_assets", "pretrained_manifest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "cuda" }]]

