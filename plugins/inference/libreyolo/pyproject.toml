[project]
name = "yoao-libreyolo-plugin"
version = "0.1.0"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
  "yoao-libreyolo-native==0.1.0",
  "yoao-inference-plugin-sdk==0.1.0",
  "yoao-backend-runtime==0.1.0",
  "yoao-inference-contract==0.1.0",
  "yoao-lifecycle-contract==0.1.0",
  "yoao-training-contract==0.1.0",
  "yoao-protocol-v2==0.2.0",
  "httpx>=0.27,<1",
  "uvicorn>=0.30,<1",
]

[project.scripts]
yoao-libreyolo = "yoao_libreyolo_plugin.cli:main"
yoao-libreyolo-evidence = "yoao_libreyolo_plugin.evidence:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["yoao_libreyolo_plugin", "yoao_libreyolo_plugin.*"]

[tool.setuptools.package-data]
yoao_libreyolo_plugin = ["controlled-model-assets.json"]

