name: Plugin Python acceptance

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
env:
  INFERENCE_MANIFEST_SHA256: 76890fba5dbe1c215b02d10e1d589bf704a0570949f951ea7f2128f6b54bb699

jobs:
  inference-wheels:
    name: Prepare locked inference wheels
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: YOAO-Labs/YOAO
          ref: 64ff57be0bd72e53202c46425f194fcd77cebe1b
          path: .sources/platform
          sparse-checkout: |
            apps/_shared/inference_contract
            apps/_shared/lifecycle_contract
            apps/_shared/protocol_v2
            apps/_shared/task_contract
            apps/_shared/training_contract
      - uses: actions/checkout@v4
        with:
          repository: YOAO-Labs/Plugin-SDK
          ref: 8daeb0cf02acf60d8b32525b650aae8796e0d886
          path: .sources/plugin-sdk
          sparse-checkout: |
            packages/inference/sdk
            packages/inference/mask-utils
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reproduce and verify first-party inference wheels
        run: |
          python -m venv "$RUNNER_TEMP/wheel-build"
          source "$RUNNER_TEMP/wheel-build/bin/activate"
          python -m pip install 'build==1.3.0' 'setuptools==80.9.0' 'wheel==0.45.1' 'hatchling==1.27.0'
          bash scripts/prepare-inference-wheels.sh .sources/platform .sources/plugin-sdk "$RUNNER_TEMP/inference-wheels"
      - uses: actions/upload-artifact@v4
        with:
          name: inference-wheels
          path: ${{ runner.temp }}/inference-wheels/
          if-no-files-found: error
          retention-days: 1

  libreyolo-python311:
    needs: inference-wheels
    name: Plugin LibreYOLO Python 3.11 CPU
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.29'
      - run: python -m pip install 'build==1.3.0' 'setuptools==80.9.0' 'wheel==0.45.1' 'hatchling==1.27.0' 'pytest>=8' 'pytest-asyncio>=0.24'
      - name: Build public publisher inputs from committed source
        run: python scripts/build-plugin-artifacts.py --revision "$GITHUB_SHA" --output "$RUNNER_TEMP/publisher" --plugin libreyolo
      - uses: ./.github/actions/stage-inference-wheels
      - name: Build private hash-locked CPU candidate
        run: |
          python scripts/build-libreyolo-candidate.py --revision "$GITHUB_SHA" --output "$RUNNER_TEMP/candidate.tar" \
            --contracts-manifest "$RUNNER_TEMP/inference-wheels" --contracts-sha256 "$INFERENCE_MANIFEST_SHA256" \
            --sdk-manifest "$RUNNER_TEMP/inference-wheels" --sdk-sha256 "$INFERENCE_MANIFEST_SHA256"
      - name: Install candidate and run CPU tests
        run: |
          mkdir "$RUNNER_TEMP/candidate"
          tar -xf "$RUNNER_TEMP/candidate.tar" -C "$RUNNER_TEMP/candidate"
          python -m pip install --no-index --find-links "$RUNNER_TEMP/candidate/wheelhouse" --only-binary=:all: --require-hashes -r "$RUNNER_TEMP/candidate/requirements.lock"
          python -m pip check
          cd "$RUNNER_TEMP"
          yoao-libreyolo --help
          yoao-libreyolo-evidence --help
          python -I -c 'import json, site; from pathlib import Path; from importlib.metadata import distribution; from importlib.resources import files; import yoao_libreyolo_plugin, libreyolo_native; assert any(Path(yoao_libreyolo_plugin.__file__).is_relative_to(p) for p in map(Path, site.getsitepackages())); assert any(Path(libreyolo_native.__file__).is_relative_to(p) for p in map(Path, site.getsitepackages())); assert json.loads(files("yoao_libreyolo_plugin").joinpath("controlled-model-assets.json").read_text())["assets"]; assert any(str(f).endswith("LICENSE") and distribution("yoao-libreyolo-plugin").locate_file(f).is_file() for f in distribution("yoao-libreyolo-plugin").files)'
          cd "$GITHUB_WORKSPACE"
          python -m pytest -q plugins/inference/libreyolo/tests scripts/test_build_libreyolo_candidate.py scripts/test_fetch_contracts.py

  yolo-python312:
    needs: inference-wheels
    name: Plugin YOLO Python 3.12 CPU
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CUDA_VISIBLE_DEVICES: ''
      NVIDIA_VISIBLE_DEVICES: void
      YOLO_STRICT_OFFLINE: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    defaults:
      run:
        working-directory: plugins/inference/yolo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.29'
          enable-cache: true
          cache-dependency-glob: plugins/inference/yolo/uv.lock
      - name: Build YOLO publisher inputs
        working-directory: .
        run: |
          python -m pip install 'build==1.3.0' 'setuptools==80.9.0' 'wheel==0.45.1'
          python scripts/build-plugin-artifacts.py --revision "$GITHUB_SHA" --output "$RUNNER_TEMP/yolo-publisher" --plugin yolo
      - uses: ./.github/actions/stage-inference-wheels
      - name: Install locked development environment
        run: uv sync --locked --extra dev --no-install-project
      - name: Check installed YOLO wheel and catalog
        run: |
          uv pip install --python .venv/bin/python --no-deps "$RUNNER_TEMP"/yolo-publisher/yoao_yolo_plugin-*.whl
          cd "$RUNNER_TEMP"
          "$GITHUB_WORKSPACE/plugins/inference/yolo/.venv/bin/python" -I -m scripts.prepare_assets --help
          "$GITHUB_WORKSPACE/plugins/inference/yolo/.venv/bin/python" -I -c 'import json, site; from pathlib import Path; from importlib.metadata import distribution; from importlib.resources import files; import main; assert any(Path(main.__file__).is_relative_to(p) for p in map(Path, site.getsitepackages())); assert json.loads(files("yolo_plugin").joinpath("pretrained-assets.json").read_text())["assets"]; assert any(str(f).endswith("LICENSE") and distribution("yoao-yolo-plugin").locate_file(f).is_file() for f in distribution("yoao-yolo-plugin").files)'
      - name: Run complete YOLO CPU suite
        run: uv run --no-sync python -m pytest -q -p no:cacheprovider
      - name: Verify plugin-owned selection descriptors
        run: uv run --no-sync python -m unittest discover -s ../../../scripts -p test_selection_descriptor.py -v

  rapidocr-python310:
    needs: inference-wheels
    name: Plugin RapidOCR Python 3.10 CPU
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CUDA_VISIBLE_DEVICES: ''
      NVIDIA_VISIBLE_DEVICES: void
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.29'
      - name: Build RapidOCR publisher inputs
        run: |
          python -m pip install 'build==1.3.0' 'setuptools==80.9.0' 'wheel==0.45.1'
          python scripts/build-plugin-artifacts.py --revision "$GITHUB_SHA" --output "$RUNNER_TEMP/rapidocr-publisher" --plugin rapidocr
      - uses: ./.github/actions/stage-inference-wheels
      - name: Prepare verified standalone inputs
        run: |
          runtime=$(printf '%s\n' .artifacts/python/first-party/yoao_backend_runtime-*.whl)
          runtime_sha=$(sha256sum "$runtime" | cut -d ' ' -f1)
          python plugins/inference/rapidocr/build-inputs.py "$RUNNER_TEMP/rapidocr-inputs" \
            --manifest "$RUNNER_TEMP/inference-wheels/manifest.json" --manifest-sha256 "$INFERENCE_MANIFEST_SHA256" \
            --runtime-wheel "$runtime" --runtime-sha256 "$runtime_sha"
      - name: Install locked headless CPU runtime and verified contracts
        run: |
          uv pip install --python "$(command -v python)" --no-deps --require-hashes -r plugins/inference/rapidocr/requirements-cpu.txt
          uv pip install --python "$(command -v python)" --no-deps \
            "$RUNNER_TEMP/rapidocr-inputs/wheels"/yoao_backend_runtime-*.whl \
            "$RUNNER_TEMP/rapidocr-inputs/wheels"/yoao_task_contract-*.whl \
            "$RUNNER_TEMP/rapidocr-inputs/wheels"/yoao_protocol_v2-*.whl \
            "$RUNNER_TEMP/rapidocr-inputs/wheels"/yoao_lifecycle_contract-*.whl
          uv pip install --python "$(command -v python)" 'pytest>=8' 'pytest-asyncio>=0.23'
      - name: Check installed RapidOCR wheel and catalog
        run: |
          uv pip install --python "$(command -v python)" --no-deps "$RUNNER_TEMP"/rapidocr-publisher/yoao_rapidocr_plugin-*.whl
          cd "$RUNNER_TEMP"
          python -I -m plugin_assets --help
          python -I -c 'import site; from pathlib import Path; from importlib.metadata import distribution; import main, pretrained_manifest; assert any(Path(main.__file__).is_relative_to(p) for p in map(Path, site.getsitepackages())); assert pretrained_manifest.descriptor()["assets"]; assert any(str(f).endswith("LICENSE") and distribution("yoao-rapidocr-plugin").locate_file(f).is_file() for f in distribution("yoao-rapidocr-plugin").files)'
      - name: Run complete RapidOCR CPU suite
        run: python -m pytest -q -p no:cacheprovider plugins/inference/rapidocr/tests

  onnxtools-python310:
    needs: inference-wheels
    name: Plugin ONNXTools Python 3.10 CPU
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CUDA_VISIBLE_DEVICES: ''
      NVIDIA_VISIBLE_DEVICES: void
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.29'
      - name: Build ONNXTools publisher inputs
        run: |
          python -m pip install 'build==1.3.0' 'setuptools==80.9.0' 'wheel==0.45.1'
          python scripts/build-plugin-artifacts.py --revision "$GITHUB_SHA" --output "$RUNNER_TEMP/onnxtools-publisher" --plugin onnxtools
      - uses: ./.github/actions/stage-inference-wheels
      - name: Install locked headless runtime and verified contracts
        run: |
          uv pip install --python "$(command -v python)" --no-deps --require-hashes -r plugins/inference/onnxtools/requirements-build.txt
          uv pip install --python "$(command -v python)" --no-deps --require-hashes -r plugins/inference/onnxtools/requirements-runtime.txt
          uv pip install --python "$(command -v python)" --no-deps --no-build-isolation -r plugins/inference/onnxtools/requirements-vcs.txt
          uv pip install --python "$(command -v python)" --no-deps \
            .artifacts/python/first-party/yoao_task_contract-*.whl \
            .artifacts/python/first-party/yoao_protocol_v2-*.whl \
            .artifacts/python/first-party/yoao_lifecycle_contract-*.whl
          uv pip install --python "$(command -v python)" --no-index --find-links .artifacts/python/first-party --no-deps --require-hashes -r plugins/inference/onnxtools/requirements-firstparty.txt
          uv pip install --python "$(command -v python)" 'pytest>=8' 'pytest-asyncio>=0.23'
      - name: Check installed ONNXTools wheel and catalog
        run: |
          uv pip install --python "$(command -v python)" --no-deps "$RUNNER_TEMP"/onnxtools-publisher/yoao_onnxtools_plugin-*.whl
          cd "$RUNNER_TEMP"
          python -I -m uvicorn --version
          python -I -c 'import json, site, sys; from pathlib import Path; from importlib.metadata import distribution; import main; assert any(Path(main.__file__).is_relative_to(p) for p in map(Path, site.getsitepackages())); assert json.loads((Path(sys.prefix)/"share/yoao-onnxtools-plugin/pretrained-model-assets.json").read_text())["assets"]; assert any(str(f).endswith("LICENSE") and distribution("yoao-onnxtools-plugin").locate_file(f).is_file() for f in distribution("yoao-onnxtools-plugin").files)'
      - name: Run complete ONNXTools CPU suite
        run: python -m pytest -q -p no:cacheprovider plugins/inference/onnxtools/tests

  grounded-sam2-python310:
    needs: inference-wheels
    name: Plugin Grounded-SAM2 Python 3.10 CPU
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CUDA_VISIBLE_DEVICES: ''
      NVIDIA_VISIBLE_DEVICES: void
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    defaults:
      run:
        working-directory: plugins/inference/grounded-sam2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.29'
          enable-cache: true
          cache-dependency-glob: plugins/inference/grounded-sam2/uv.lock
      - name: Build standalone publisher inputs
        working-directory: .
        run: |
          python -m pip install 'build==1.3.0' 'setuptools==70.3.0' 'wheel==0.45.1'
          python scripts/build-plugin-artifacts.py --revision "$GITHUB_SHA" --output "$RUNNER_TEMP/grounded-sam2-publisher" --plugin grounded-sam2
      - uses: ./.github/actions/stage-inference-wheels
      - name: Install locked development environment
        run: uv sync --locked --extra dev --no-install-project
      - name: Check installed Grounded-SAM2 wheel and catalog
        run: |
          uv pip install --python .venv/bin/python --no-deps "$RUNNER_TEMP"/grounded-sam2-publisher/yoao_grounded_sam2_plugin-*.whl
          cd "$RUNNER_TEMP"
          "$GITHUB_WORKSPACE/plugins/inference/grounded-sam2/.venv/bin/python" -I -m uvicorn --version
          "$GITHUB_WORKSPACE/plugins/inference/grounded-sam2/.venv/bin/python" -I -c 'import json, site; from pathlib import Path; from importlib.metadata import distribution; from importlib.resources import files; import main; assert any(Path(main.__file__).is_relative_to(p) for p in map(Path, site.getsitepackages())); assert json.loads(files("grounded_sam2_plugin").joinpath("pretrained-assets.json").read_text())["assets"]; assert any(str(f).endswith("LICENSE") and distribution("yoao-grounded-sam2-plugin").locate_file(f).is_file() for f in distribution("yoao-grounded-sam2-plugin").files)'
      - name: Run complete Grounded-SAM2 CPU suite
        run: uv run --no-sync python -m pytest -q -p no:cacheprovider

  sam3-python312:
    needs: inference-wheels
    name: Plugin SAM3 Python 3.12 CPU
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CUDA_VISIBLE_DEVICES: ''
      NVIDIA_VISIBLE_DEVICES: void
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    defaults:
      run:
        working-directory: plugins/inference/sam3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.29'
          enable-cache: true
          cache-dependency-glob: plugins/inference/sam3/uv.lock
      - name: Build standalone publisher inputs
        working-directory: .
        run: |
          python -m pip install 'build==1.3.0' 'setuptools==80.9.0' 'wheel==0.45.1'
          python scripts/build-plugin-artifacts.py --revision "$GITHUB_SHA" --output "$RUNNER_TEMP/sam3-publisher" --plugin sam3
      - uses: ./.github/actions/stage-inference-wheels
      - name: Initialize exact SAM3 vendor source
        working-directory: .
        run: git submodule update --init --depth 1 -- plugins/inference/sam3/vendor/sam3
      - name: Apply request-scoped autocast patch
        run: patch --batch --forward --fuzz=0 -d vendor/sam3 -p1 --input="$PWD/patches/0001-request-scoped-autocast.patch"
      - name: Install locked development environment
        run: uv sync --locked --extra dev --no-install-project
      - name: Check installed SAM3 wheel and catalog
        run: |
          uv pip install --python .venv/bin/python --no-deps "$RUNNER_TEMP"/sam3-publisher/yoao_sam3_plugin-*.whl
          cd "$RUNNER_TEMP"
          "$GITHUB_WORKSPACE/plugins/inference/sam3/.venv/bin/python" -I -m uvicorn --version
          "$GITHUB_WORKSPACE/plugins/inference/sam3/.venv/bin/python" -I -c 'import json, site; from pathlib import Path; from importlib.metadata import distribution; from importlib.resources import files; import main; assert any(Path(main.__file__).is_relative_to(p) for p in map(Path, site.getsitepackages())); assert json.loads(files("sam3_plugin").joinpath("pretrained-assets.json").read_text())["assets"]; assert any(str(f).endswith("LICENSE") and distribution("yoao-sam3-plugin").locate_file(f).is_file() for f in distribution("yoao-sam3-plugin").files)'
      - name: Run complete SAM3 CPU suite
        run: uv run --no-sync python -m pytest -q -p no:cacheprovider
