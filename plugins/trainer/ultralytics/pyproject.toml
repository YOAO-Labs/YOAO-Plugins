[project]
name = "yoao-trainer-ultralytics"
version = "1.0.0"
description = "Official Ultralytics YOLO 8.4.183 detection and instance segmentation trainer plugin for YOAO"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "AGPL-3.0.txt"]
requires-python = ">=3.11,<3.14"

dependencies = [
    "yoao-plugin-sdk[trainer]==0.1.0",
    "pydantic>=2.5,<3",
    "pillow>=10.0",
    "pyyaml>=6.0",
    "numpy>=1.24,<3.0",
]

[project.optional-dependencies]
runtime = [
    "ultralytics==8.4.183",
    "opencv-python>=4.9",
    "torch==2.14.1",
    "torchvision==0.29.1",
    "setuptools>=77",
    "wheel",
]
dev = [
    "pytest>=8",
]

[project.scripts]
yoao-trainer-ultralytics = "yoao_trainer_ultralytics.cli:main"

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["yoao_trainer_ultralytics"]
include-package-data = true

[tool.setuptools.package-data]
yoao_trainer_ultralytics = [
    "native_inventory_current.json",
    "pretrained-assets.json",
]

[tool.uv.sources]
yoao-plugin-sdk = { path = "../../../.artifacts/python/first-party/yoao_plugin_sdk-0.1.0-py3-none-any.whl" }
torch = { index = "pytorch-cu132" }
torchvision = { index = "pytorch-cu132" }

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
