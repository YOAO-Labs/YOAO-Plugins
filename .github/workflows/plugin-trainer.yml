name: Plugin trainer acceptance

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  SDK_MANIFEST: ${{ vars.YOAO_SDK_MANIFEST }}
  SDK_MANIFEST_SHA256: ${{ vars.YOAO_SDK_MANIFEST_SHA256 }}
  CUDA_VISIBLE_DEVICES: ''
  NVIDIA_VISIBLE_DEVICES: void
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  trainer-ultralytics-python312:
    name: Plugin trainer Ultralytics Python 3.12 CPU
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Stage verified yoao-plugin-sdk wheel
        run: |
          : "${SDK_MANIFEST:?Set YOAO_SDK_MANIFEST}" "${SDK_MANIFEST_SHA256:?Set YOAO_SDK_MANIFEST_SHA256}"
          mkdir -p .artifacts/python/first-party
          python scripts/fetch-contracts.py --manifest "$SDK_MANIFEST" --sha256 "$SDK_MANIFEST_SHA256" \
            --output .artifacts/python/first-party --package yoao-plugin-sdk
      - name: Build and verify Ultralytics trainer wheel on CPU
        run: |
          python -m venv "$RUNNER_TEMP/venv-ultralytics"
          "$RUNNER_TEMP/venv-ultralytics/bin/python" -m pip install --upgrade pip 'setuptools>=68' wheel 'pytest>=8' 'pydantic>=2.5' pillow pyyaml numpy
          "$RUNNER_TEMP/venv-ultralytics/bin/python" -m pip install --no-deps .artifacts/python/first-party/yoao_plugin_sdk-*.whl
          "$RUNNER_TEMP/venv-ultralytics/bin/python" -m pip wheel --no-deps --no-build-isolation -w "$RUNNER_TEMP/wheels" plugins/trainer/ultralytics
          "$RUNNER_TEMP/venv-ultralytics/bin/python" -m pip install --no-deps "$RUNNER_TEMP/wheels"/yoao_trainer_ultralytics-*.whl
          "$RUNNER_TEMP/venv-ultralytics/bin/yoao-plugin" validate plugins/trainer/ultralytics/manifest.json
          "$RUNNER_TEMP/venv-ultralytics/bin/yoao-trainer-ultralytics" describe > "$RUNNER_TEMP/ultralytics-capabilities.json"
          "$RUNNER_TEMP/venv-ultralytics/bin/pytest" -q plugins/trainer/ultralytics/tests

  trainer-libreyolo-python312:
    name: Plugin trainer LibreYOLO Python 3.12 CPU
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Stage verified yoao-plugin-sdk wheel
        run: |
          : "${SDK_MANIFEST:?Set YOAO_SDK_MANIFEST}" "${SDK_MANIFEST_SHA256:?Set YOAO_SDK_MANIFEST_SHA256}"
          mkdir -p .artifacts/python/first-party
          python scripts/fetch-contracts.py --manifest "$SDK_MANIFEST" --sha256 "$SDK_MANIFEST_SHA256" \
            --output .artifacts/python/first-party --package yoao-plugin-sdk
      - name: Build and verify LibreYOLO trainer wheel on CPU
        run: |
          python -m venv "$RUNNER_TEMP/venv-libreyolo"
          "$RUNNER_TEMP/venv-libreyolo/bin/python" -m pip install --upgrade pip 'setuptools>=68' wheel 'pytest>=8' 'pydantic>=2.5' pyyaml
          "$RUNNER_TEMP/venv-libreyolo/bin/python" -m pip install --no-deps .artifacts/python/first-party/yoao_plugin_sdk-*.whl
          "$RUNNER_TEMP/venv-libreyolo/bin/python" -m pip wheel --no-deps --no-build-isolation -w "$RUNNER_TEMP/wheels" plugins/trainer/libreyolo
          "$RUNNER_TEMP/venv-libreyolo/bin/python" -m pip install --no-deps "$RUNNER_TEMP/wheels"/yoao_trainer_libreyolo-*.whl
          "$RUNNER_TEMP/venv-libreyolo/bin/yoao-plugin" validate plugins/trainer/libreyolo/manifest.json
          "$RUNNER_TEMP/venv-libreyolo/bin/yoao-trainer-libreyolo" describe > "$RUNNER_TEMP/libreyolo-capabilities.json"
          "$RUNNER_TEMP/venv-libreyolo/bin/pytest" -q plugins/trainer/libreyolo/tests
