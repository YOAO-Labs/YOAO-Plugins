name: Plugin Python acceptance

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-mask-python310:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install 'pytest>=8' 'pytest-asyncio>=0.24'
      - run: python scripts/fetch-contracts.py "$RUNNER_TEMP/contracts"
      - run: |
          python -m pip install "$RUNNER_TEMP/contracts/aap_task_contract-0.1.0-py3-none-any.whl" "$RUNNER_TEMP/contracts/aap_lifecycle_contract-0.1.0-py3-none-any.whl" "$RUNNER_TEMP/contracts/aap_protocol_v2-0.2.0-py3-none-any.whl" -e packages/backend-runtime -e packages/mask-utils
          python -m pytest -q packages/backend-runtime/tests packages/mask-utils/tests

  libreyolo-python311:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'build==1.3.0' 'setuptools==80.9.0' 'wheel==0.45.1' 'hatchling==1.27.0' 'pytest>=8' 'pytest-asyncio>=0.24'
      - name: Build public publisher inputs from committed source
        run: python scripts/build-plugin-artifacts.py --revision "$GITHUB_SHA" --output "$RUNNER_TEMP/publisher"
      - name: Build private hash-locked CPU candidate
        run: python scripts/build-libreyolo-candidate.py --revision "$GITHUB_SHA" --output "$RUNNER_TEMP/candidate.tar"
      - name: Install candidate and run CPU tests
        run: |
          mkdir "$RUNNER_TEMP/candidate"
          tar -xf "$RUNNER_TEMP/candidate.tar" -C "$RUNNER_TEMP/candidate"
          python -m pip install --no-index --find-links "$RUNNER_TEMP/candidate/wheelhouse" --only-binary=:all: --require-hashes -r "$RUNNER_TEMP/candidate/requirements.lock"
          python -m pip check
          python -m pytest -q packages/backend-runtime/tests
          python -m pytest -q packages/inference-plugin-sdk/tests
          python -m pytest -q plugins/libreyolo/tests scripts/test_build_libreyolo_candidate.py
